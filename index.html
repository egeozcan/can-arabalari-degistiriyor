<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#2b2140">
<link rel="apple-touch-icon" href="icon.png">

<title>Çılgın Arabalar</title>
<style>
  @font-face {
    font-family: 'Baloo 2'; font-style: normal; font-weight: 800; font-display: swap;
    src: url(fonts/baloo2-800-latin-ext.woff) format('woff');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Baloo 2'; font-style: normal; font-weight: 800; font-display: swap;
    src: url(fonts/baloo2-800-latin.woff) format('woff');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2140; overscroll-behavior: none; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; left: 0; top: 0; outline: none; touch-action: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<noscript>Bu oyun için JavaScript gerekiyor.</noscript>
<script src="game.js"></script>
